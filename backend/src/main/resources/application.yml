spring:
  application:
    name: fitonyash-backend
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fitonyash}
    username: ${DB_USERNAME:fitonyash}
    password: ${DB_PASSWORD:fitonyash123}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:fitonyash-super-secret-key-for-jwt-token-generation-minimum-256-bits}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}    # 15 минут
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 дней

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Logging
logging:
  level:
    com.fitonyash: DEBUG
    org.springframework.security: INFO

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

